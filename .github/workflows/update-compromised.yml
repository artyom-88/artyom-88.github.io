name: Update Compromised Packages

on:
  schedule:
    # Run every Sunday at 00:00 UTC (weekly updates)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  update-compromised-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit and push changes
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.STORE_PATH }}
            ./node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update compromised packages list
        run: pnpm compromised:update
        continue-on-error: true # Don't fail if API is unavailable

      - name: Check for changes
        id: check-changes
        run: |
          if [ -n "$(git status --porcelain compromised.txt)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add compromised.txt
          git commit -m 'chore: update compromised packages list [skip ci]'
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.check-changes.outputs.has_changes == 'false'
        run: |
          echo "✅ No changes to compromised packages list"

